
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Siswa dan Nilai Rata-rata</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #0002;
        }

        h1 {
            color: #1756a9;
            text-align: center;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            background: #1769e0;
            margin-top: 15px;
        }

        .hapus {
            background: #dc3545;
            margin: 0;
        }

        .tabel {
            overflow-x: auto;
            margin-top: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #1769e0;
            color: white;
        }

        tr:nth-child(even) {
            background: #f3f7fc;
        }

        .ringkasan {
            margin-top: 20px;
            background: #e5efff;
            padding: 15px;
            border-radius: 8px;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Data Siswa</h1>
    <p style="text-align:center">
        Aplikasi Penentuan Nilai Rata-rata Siswa
    </p>

    <h3>Form Input Data Siswa</h3>

    <form id="formSiswa">
        <div class="form-grid">
            <div>
                <label for="nama">Nama Siswa</label>
                <input type="text" id="nama"
                    placeholder="Masukkan nama siswa" required>
            </div>

            <div>
                <label for="kelas">Kelas</label>
                <input type="text" id="kelas"
                    placeholder="Contoh : XII" required>
            </div>

            <div>
                <label for="mtk">Nilai Matematika</label>
                <input type="number" id="mtk"
                    min="0" max="100" step="any" required placeholder="Contoh : 75">
            </div>

            <div>
                <label for="bindo">Nilai Bahasa Indonesia</label>
                <input type="number" id="bindo"
                    min="0" max="100" step="any" required placeholder="Contoh : 75">
            </div>

            <div>
                <label for="bing">Nilai Bahasa Inggris</label>
                <input type="number" id="bing"
                    min="0" max="100" step="any" required placeholder="Contoh : 75">
            </div>

            <div>
                <label for="ips">Nilai IPS</label>
                <input type="number" id="ips"
                    min="0" max="100" step="any" required placeholder="Contoh : 75">
            </div>
        </div>

        <button type="submit">Tambah Data Siswa</button>
    </form>

    <div class="tabel">
        <h3>Tabel Data Nilai Siswa</h3>

        <table>
            <thead>
                <tr>
                    <th>No.</th>
                    <th>Nama Siswa</th>
                    <th>Kelas</th>
                    <th>Matematika</th>
                    <th>Bahasa Indonesia</th>
                    <th>Bahasa Inggris</th>
                    <th>IPS</th>
                    <th>Rata-rata</th>
                    <th>Predikat</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="tabelSiswa"></tbody>
        </table>
    </div>

    <div class="ringkasan">
        <h3>Ringkasan Nilai</h3>
        <p>Jumlah siswa: <strong id="jumlah">0</strong></p>
        <p>Rata-rata seluruh siswa:
            <strong id="rataSemua">0.00</strong>
        </p>
    </div>
</div>

<script>
    const siswa = [];

    const form = document.getElementById("formSiswa");
    const tabel = document.getElementById("tabelSiswa");

    function predikat(nilai) {
        if (nilai >= 90) return "A";
        if (nilai >= 80) return "B";
        if (nilai >= 70) return "C";
        return "D";
    }

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        const nama = document.getElementById("nama").value.trim();
        const kelas = document.getElementById("kelas").value.trim();
        const mtk = Number(document.getElementById("mtk").value);
        const bindo = Number(document.getElementById("bindo").value);
        const bing = Number(document.getElementById("bing").value);
        const ips = Number(document.getElementById("ips").value);

        if (!nama || !kelas ||
            [mtk, bindo, bing, ips].some(
                n => !Number.isFinite(n) || n < 0 || n > 100
            )) {
            alert("Isi semua data dengan benar. Nilai harus 0 sampai 100.");
            return;
        }

        const rata = (mtk + bindo + bing + ips) / 4;

        siswa.push({
            nama, kelas, mtk, bindo, bing, ips, rata
        });

        tampilkanData();
        form.reset();
        document.getElementById("nama").focus();
    });

    function tampilkanData() {
        tabel.innerHTML = "";

        siswa.forEach((s, index) => {
            const baris = document.createElement("tr");

            [
                index + 1,
                s.nama,
                s.kelas,
                s.mtk,
                s.bindo,
                s.bing,
                s.ips,
                s.rata.toFixed(2),
                predikat(s.rata)
            ].forEach(nilai => {
                const td = document.createElement("td");
                td.textContent = nilai;
                baris.appendChild(td);
            });

            const tdAksi = document.createElement("td");
            const tombol = document.createElement("button");

            tombol.textContent = "Hapus";
            tombol.className = "hapus";

            tombol.addEventListener("click", () => {
                siswa.splice(index, 1);
                tampilkanData();
            });

            tdAksi.appendChild(tombol);
            baris.appendChild(tdAksi);
            tabel.appendChild(baris);
        });

        document.getElementById("jumlah").textContent = siswa.length;

        const total = siswa.reduce(
            (jumlah, s) => jumlah + s.rata, 0
        );

        const rataSemua = siswa.length ? total / siswa.length : 0;

        document.getElementById("rataSemua").textContent =
            rataSemua.toFixed(2);
    }
</script>

</body>
</html>
